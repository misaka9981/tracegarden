services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: tracegarden
      POSTGRES_USER: tracegarden
      POSTGRES_PASSWORD: local-only
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracegarden -d tracegarden"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - tracegarden-postgres:/var/lib/postgresql
  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    environment:
      DATABASE_URL: postgresql://tracegarden:local-only@postgres:5432/tracegarden
      BETTER_AUTH_SECRET: local-container-only
      BETTER_AUTH_URL: https://tracegarden.example
      GOOGLE_CLIENT_ID: local-container-smoke
      GOOGLE_CLIENT_SECRET: local-container-only
      GOOGLE_REDIRECT_URI: https://tracegarden.example/api/auth/callback/google
      TRACEGARDEN_BOOTSTRAP_ISSUER: https://accounts.google.com
      TRACEGARDEN_BOOTSTRAP_SUBJECT: local-container-bootstrap
      PORT: "3000"
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
  collector:
    build:
      context: .
      dockerfile: deploy/docker/collector.Dockerfile
    environment:
      DATABASE_URL: postgresql://tracegarden:local-only@postgres:5432/tracegarden
      TRACEGARDEN_BOOTSTRAP_ISSUER: https://accounts.google.com
      TRACEGARDEN_BOOTSTRAP_SUBJECT: local-container-bootstrap
      COLLECTOR_PORT: "3001"
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"

volumes:
  tracegarden-postgres:
