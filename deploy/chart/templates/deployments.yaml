apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tracegarden.fullname" . }}-web
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "tracegarden.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "tracegarden.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "tracegarden.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "tracegarden.logsServiceAccount" . }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-schema
          image: {{ include "tracegarden.image" (dict "root" . "component" "web") | quote }}
          imagePullPolicy: IfNotPresent
          command: ["node", "--input-type=module", "--eval"]
          args:
            - |
{{ include "tracegarden.schemaWaitScript" . | nindent 14 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tracegarden.databaseSecret" . }}
                  key: {{ .Values.secrets.database.urlKey | quote }}
            - name: MIGRATION_SCHEMA_READY_TIMEOUT_SECONDS
              value: {{ .Values.migration.schemaReadyTimeoutSeconds | quote }}
            - name: MIGRATION_SCHEMA_READY_RETRY_SECONDS
              value: {{ .Values.migration.schemaReadyRetrySeconds | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      containers:
        - name: web
          image: {{ include "tracegarden.image" (dict "root" . "component" "web") | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tracegarden.fullname" . }}-config
                  key: NODE_ENV
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tracegarden.fullname" . }}-config
                  key: HOST
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tracegarden.fullname" . }}-config
                  key: PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tracegarden.databaseSecret" . }}
                  key: {{ .Values.secrets.database.urlKey | quote }}
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "tracegarden.applicationSecret" . }}
                  key: {{ .Values.secrets.application.betterAuthKey | quote }}
            - name: TIMELINE_CURSOR_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "tracegarden.applicationSecret" . }}
                  key: {{ .Values.secrets.application.timelineCursorKey | quote }}
            - name: BETTER_AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tracegarden.fullname" . }}-config
                  key: BETTER_AUTH_URL
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tracegarden.fullname" . }}-config
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.google.existingSecret | quote }}
                  key: {{ .Values.secrets.google.clientSecretKey | quote }}
            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tracegarden.fullname" . }}-config
                  key: GOOGLE_REDIRECT_URI
            - name: TRACEGARDEN_BOOTSTRAP_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tracegarden.fullname" . }}-config
                  key: TRACEGARDEN_BOOTSTRAP_ISSUER
            - name: TRACEGARDEN_BOOTSTRAP_SUBJECT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tracegarden.fullname" . }}-config
                  key: TRACEGARDEN_BOOTSTRAP_SUBJECT
            - name: KUBERNETES_LOG_API_SERVER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tracegarden.fullname" . }}-config
                  key: KUBERNETES_LOG_API_SERVER
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
