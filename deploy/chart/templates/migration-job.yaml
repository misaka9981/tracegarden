apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tracegarden.migrationJobName" . }}
  labels:
    {{- include "tracegarden.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "tracegarden.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "tracegarden.image" (dict "root" . "component" "migrate") | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tracegarden.databaseSecret" . }}
                  key: {{ .Values.secrets.database.urlKey | quote }}
            - name: MIGRATION_DATABASE_READY_TIMEOUT_SECONDS
              value: {{ .Values.migration.databaseReadyTimeoutSeconds | quote }}
            - name: MIGRATION_DATABASE_READY_RETRY_SECONDS
              value: {{ .Values.migration.databaseReadyRetrySeconds | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
