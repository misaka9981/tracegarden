apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tracegarden.fullname" . }}-config
  labels:
    {{- include "tracegarden.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  HOST: "0.0.0.0"
  PORT: {{ .Values.web.port | quote }}
  COLLECTOR_PORT: {{ .Values.collector.port | quote }}
  BETTER_AUTH_URL: {{ .Values.config.betterAuthUrl | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.config.googleClientId | quote }}
  GOOGLE_REDIRECT_URI: {{ .Values.config.googleRedirectUri | quote }}
  TRACEGARDEN_BOOTSTRAP_ISSUER: {{ .Values.config.bootstrapIssuer | quote }}
  TRACEGARDEN_BOOTSTRAP_SUBJECT: {{ .Values.config.bootstrapSubject | quote }}
  KUBERNETES_API_SERVER: {{ .Values.config.observationApiServer | quote }}
  KUBERNETES_LOG_API_SERVER: {{ .Values.config.logApiServer | quote }}
  RETENTION_CLEANUP_INTERVAL_MS: {{ .Values.config.retentionCleanupIntervalMs | quote }}
