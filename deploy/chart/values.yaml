# Every application image is pinned by digest. Update these values from the
# release attestation; image tags are intentionally not supported.
images:
  web:
    repository: ghcr.io/misaka3389/tracegarden-web
    digest: sha256:b95ddd90e6a525915d68f81df1a42a4a5d1994a1d5c136ba1955a6508f76f843
  collector:
    repository: ghcr.io/misaka3389/tracegarden-collector
    digest: sha256:0823af5872c101651899f5181af1669a0ebb87e2672c2032bb3bd3a26ade02b6
  migrate:
    repository: ghcr.io/misaka3389/tracegarden-migrate
    digest: sha256:0ed108dbe1b1ed6e4e20863d050e5a7f1a9ee0e19854138d9405147a8b61019d
  backup:
    repository: ghcr.io/misaka3389/tracegarden-backup
    # Documentation-only placeholder. Replace with the exact attested backup_digest before enabling backup.
    digest: sha256:4444444444444444444444444444444444444444444444444444444444444444
  postgres:
    repository: postgres
    digest: sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7

web:
  replicaCount: 2
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

collector:
  replicaCount: 1
  port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

migration:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  databaseReadyTimeoutSeconds: 120
  databaseReadyRetrySeconds: 2
  schemaReadyTimeoutSeconds: 600
  schemaReadyRetrySeconds: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

backup:
  # The CronJob remains suspended until every backup and restore gate is explicit.
  enabled: false
  endpoint: ""
  # Replace the documentation-only CIDR with the authorized endpoint range when enabling.
  endpointCIDRs:
    - 192.0.2.0/24
  bucket: ""
  schedule: ""
  retentionDays: 0
  offVm: true
  region: auto
  encryption:
    mechanism: ""
    keySecret:
      existingSecret: ""
      key: ""
  credentials:
    existingSecret: ""
    accessKeyIdKey: ""
    secretAccessKeyKey: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  database: tracegarden
  username: tracegarden
  port: 5432
  persistence:
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

config:
  betterAuthUrl: https://tracegarden.example
  googleClientId: replace-with-google-client-id
  googleRedirectUri: https://tracegarden.example/api/auth/callback/google
  bootstrapIssuer: https://accounts.google.com
  bootstrapSubject: replace-with-google-subject
  observationApiServer: https://kubernetes.example:6443
  logApiServer: https://kubernetes.example:6443
  retentionCleanupIntervalMs: "86400000"

secrets:
  database:
    existingSecret: tracegarden-database
    urlKey: DATABASE_URL
    passwordKey: POSTGRES_PASSWORD
  application:
    existingSecret: tracegarden-application
    betterAuthKey: BETTER_AUTH_SECRET
    timelineCursorKey: TIMELINE_CURSOR_SECRET
  google:
    existingSecret: tracegarden-google
    clientSecretKey: GOOGLE_CLIENT_SECRET

serviceAccount:
  create: true
  observationName: ""
  logsName: ""

# Roles are rendered in each approved namespace; ServiceAccounts remain in the release namespace.
rbac:
  namespaces:
    - tracegarden
  resourceKinds:
    - Deployment
    - StatefulSet
    - DaemonSet
    - ReplicaSet
    - Pod
    - Job
    - CronJob
    - Event

service:
  web:
    type: ClusterIP
    port: 80
  collector:
    type: ClusterIP
    port: 3001
  postgres:
    type: ClusterIP
    port: 5432

ingress:
  enabled: true
  className: nginx
  host: tracegarden.example
  tls:
    enabled: true
    secretName: tracegarden-tls
  annotations: {}

networkPolicy:
  # Supply the CIDRs of the Kubernetes API endpoint(s) and Google OAuth HTTPS endpoints.
  # Documentation-only defaults are deliberately non-routable and grant no unrestricted egress.
  controlPlaneCIDRs:
    - 192.0.2.0/24
  controlPlanePort: 6443
  googleOAuthCIDRs:
    - 192.0.2.0/24
  ingressNamespace: ingress-nginx
  dnsNamespace: kube-system
  dnsPodSelector:
    k8s-app: kube-dns
