apiVersion: v1
kind: Service
metadata:
  name: {{ include "tracegarden-preview.postgresService" . }}
  labels:
    {{- include "tracegarden-preview.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "tracegarden-preview.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tracegarden-preview.fullname" . }}-postgres
  labels:
    {{- include "tracegarden-preview.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "tracegarden-preview.postgresService" . }}
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "tracegarden-preview.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "tracegarden-preview.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      automountServiceAccountToken: false
      priorityClassName: tracegarden-preview
      preemptionPolicy: Never
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ include "tracegarden-preview.image" (dict "root" . "component" "postgres") | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: tracegarden_preview
            - name: POSTGRES_USER
              value: tracegarden_preview
            - name: POSTGRES_PASSWORD
              value: {{ printf "preview-only-pr-%d" (int .Values.preview.number) | quote }}
          resources:
            {{- toYaml .Values.preview.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: database
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: database
          emptyDir: {}
