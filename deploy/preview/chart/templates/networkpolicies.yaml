apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tracegarden-preview.fullname" . }}-default-deny
  labels:
    {{- include "tracegarden-preview.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tracegarden-preview.fullname" . }}-web
  labels:
    {{- include "tracegarden-preview.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tracegarden-preview.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "tracegarden-preview.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tracegarden-preview.fullname" . }}-collector
  labels:
    {{- include "tracegarden-preview.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tracegarden-preview.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collector
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "tracegarden-preview.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: 3001
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "tracegarden-preview.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tracegarden-preview.fullname" . }}-postgres
  labels:
    {{- include "tracegarden-preview.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tracegarden-preview.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "tracegarden-preview.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: web
        - podSelector:
            matchLabels:
              {{- include "tracegarden-preview.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: collector
        - podSelector:
            matchLabels:
              {{- include "tracegarden-preview.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: migration
        - podSelector:
            matchLabels:
              {{- include "tracegarden-preview.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: seed
      ports:
        - protocol: TCP
          port: 5432
