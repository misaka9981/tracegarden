name: Tracegarden CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: tracegarden-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 26.8.1
  PNPM_VERSION: 11.9.0
  BUN_IMAGE: docker.io/oven/bun:1.4.0-distroless@sha256:76caa97ddc0e01333d98c6ab5499539dad4bbceae6237eac83e7853d3826b981
  POSTGRES_IMAGE: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
  HELM_IMAGE: docker.io/alpine/helm:3.17.3@sha256:d899e6316789fec04ee95300a18e454b7942539cbb3d89bde3e0655d6ca2e895
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.6.7@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c
  TRIVY_IMAGE: docker.io/aquasec/trivy:0.59.1@sha256:029e990b328d149bf0a9ffe355919041e1f86192db2df47e217f8a36dd42ceac

jobs:
  policy:
    name: Offline delivery policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          package-manager-cache: false
      - run: node scripts/delivery-policy.mjs

  static:
    name: Frozen install, types, lint, and domain tests
    needs: policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          package-manager-cache: false
      - run: npm install --global pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  postgres:
    name: PostgreSQL integration tests
    needs: policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          package-manager-cache: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: 1.4.0
      - run: npm install --global pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile
      - run: docker pull "$POSTGRES_IMAGE"
      - run: pnpm test:postgres

  browser:
    name: Playwright browser smoke tests
    needs: policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          package-manager-cache: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: 1.4.0
      - run: npm install --global pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile
      - run: docker pull "$POSTGRES_IMAGE"
      - run: pnpm test:browser

  container:
    name: Non-root container smoke tests and image CVE scan
    needs: policy
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      CONTAINER_SMOKE_PROJECT: tracegarden-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CONTAINER_SMOKE_IMAGE_FILE: /tmp/tracegarden-image-ids.txt
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          package-manager-cache: false
      - run: npm install --global pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: docker pull --platform linux/arm64 "$POSTGRES_IMAGE"
      - run: docker pull --platform linux/arm64 "$BUN_IMAGE"
      - run: pnpm test:container
      - name: Run Bun compiled-ESM compatibility gate
        env:
          BUN_COMPAT_PROJECT: tracegarden-bun-ci-${{ github.run_id }}-${{ github.run_attempt }}
          BUN_COMPAT_DATABASE_PORT: 45440
        run: |
          set -eu
          bun_container="${BUN_COMPAT_PROJECT}-postgres"
          docker run --pull=never -d --name "$bun_container" -p "127.0.0.1:${BUN_COMPAT_DATABASE_PORT}:5432" \
            -e POSTGRES_DB=tracegarden -e POSTGRES_USER=tracegarden -e POSTGRES_PASSWORD=local-only "$POSTGRES_IMAGE"
          cleanup() { docker rm -f "$bun_container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if docker exec "$bun_container" pg_isready -U tracegarden -d tracegarden >/dev/null 2>&1; then break; fi
            if [ "$attempt" = 60 ]; then exit 1; fi
            sleep 0.5
          done
          docker run --rm --pull=never --platform linux/arm64 --network host --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=64m --user nonroot \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            -e BUN_COMPAT_DATABASE_URL="postgresql://tracegarden:local-only@127.0.0.1:${BUN_COMPAT_DATABASE_PORT}/tracegarden" \
            -e BUN_RUNTIME_TRANSPILER_CACHE_PATH=/tmp/bun-compat-cache \
            -e BUN_COMPAT_EXPECT_CONTAINER_BOUNDARY=1 \
            "$BUN_IMAGE" scripts/bun-compatibility.mjs
          docker run --rm --pull=never --platform linux/arm64 --network host --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=64m --user nonroot \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            -e MIGRATION_BUN_DATABASE_URL="postgresql://tracegarden:local-only@127.0.0.1:${BUN_COMPAT_DATABASE_PORT}/tracegarden" \
            "$BUN_IMAGE" scripts/migrate-bun-smoke.mjs
          docker run --rm --pull=never --platform linux/arm64 --network host --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=64m --user nonroot \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            "$BUN_IMAGE" scripts/collector-resilience.mjs
          docker run --rm --pull=never --platform linux/arm64 --network host --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=64m --user nonroot \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            "$BUN_IMAGE" scripts/backup-test.mjs
      - name: Scan built images for actionable CVEs
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tracegarden-cve" "$RUNNER_TEMP/trivy-cache"
          test -s "$CONTAINER_SMOKE_IMAGE_FILE"
          failed=0
          while IFS='=' read -r service image; do
            test -n "$service" && test -n "$image"
            status=0
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/tracegarden-cve:/reports" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
              "$TRIVY_IMAGE" image --format json --output "/reports/${service}.json" \
              --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$image" || status=$?
            if [ "$status" -ne 0 ]; then failed=1; fi
          done < "$CONTAINER_SMOKE_IMAGE_FILE"
          exit "$failed"
      - name: Upload image CVE evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tracegarden-${{ github.sha }}-image-security-evidence
          path: |
            ${{ runner.temp }}/tracegarden-image-ids.txt
            ${{ runner.temp }}/tracegarden-cve
          if-no-files-found: warn
          retention-days: 30

  manifests:
    name: Offline Helm render and schema validation
    needs: policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      KUBECONFORM_SCHEMA_LOCATION: ${{ github.workspace }}/.ci/kubeconform-schemas/v1.31.0-standalone-strict/
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          package-manager-cache: false
      - run: npm install --global pnpm@${PNPM_VERSION}
      - name: Provision checksummed local Kubernetes schemas
        run: |
          set -eu
          sha256sum -c deploy/kubeconform-schemas/SHA256SUMS
          pnpm delivery:schema
      - name: Install digest-pinned offline manifest tools
        run: |
          set -eu
          docker pull "$HELM_IMAGE"
          docker pull "$KUBECONFORM_IMAGE"
          mkdir -p "$RUNNER_TEMP/tracegarden-tools"
          cat > "$RUNNER_TEMP/tracegarden-tools/helm" <<'EOF'
          #!/bin/sh
          exec docker run --rm -i --network none -v "$GITHUB_WORKSPACE:/work:ro" -w /work "$HELM_IMAGE" "$@"
          EOF
          cat > "$RUNNER_TEMP/tracegarden-tools/kubeconform" <<'EOF'
          #!/bin/sh
          exec docker run --rm -i --network none -v "$GITHUB_WORKSPACE:/work:ro" -w /work "$KUBECONFORM_IMAGE" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/tracegarden-tools/helm" "$RUNNER_TEMP/tracegarden-tools/kubeconform"
          echo "$RUNNER_TEMP/tracegarden-tools" >> "$GITHUB_PATH"
      - run: command -v helm && command -v kubeconform
      - run: pnpm preview:validate
      - run: pnpm test:chart
      - run: pnpm chart:render
      - run: pnpm chart:validate

  preview-publish:
    name: Build immutable pull-request preview images
    if: vars.ENABLE_PREVIEW_PUBLICATION == 'true' && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs: [static, postgres, browser, manifests, container, security]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      web_digest: ${{ steps.web.outputs.digest }}
      collector_digest: ${{ steps.collector.outputs.digest }}
      migrate_digest: ${{ steps.migrate.outputs.digest }}
      backup_digest: ${{ steps.backup.outputs.digest }}
    env:
      GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE }}
      IMAGE_PREFIX: ghcr.io/${{ vars.GHCR_NAMESPACE }}/tracegarden
      PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          package-manager-cache: false
      - run: npm install --global pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/container-context.mjs
      - run: docker pull --platform linux/arm64 "$BUN_IMAGE"
      - name: Verify preview publication namespace configuration
        run: test "$GHCR_NAMESPACE" = misaka9981 && test "$GHCR_NAMESPACE" = "${GHCR_NAMESPACE,,}"
      - name: Login to the configured private GHCR namespace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # Tags are only build transport; the value-file handoff below records
      # the registry's immutable digest, never the tag.
      - name: Publish pull-request web image
        id: web
        run: |
          set -eu
          docker buildx build --network none --pull=false --build-context frozen=.scratch/container-context --platform linux/arm64 --file deploy/docker/web.Dockerfile --tag "${IMAGE_PREFIX}-web:pr-${PREVIEW_NUMBER}-${PREVIEW_COMMIT}" --push --provenance=false --sbom=false --label "org.opencontainers.image.revision=${PREVIEW_COMMIT}" --metadata-file "$RUNNER_TEMP/preview-web.json" .
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/preview-web.json")" >> "$GITHUB_OUTPUT"
      - name: Publish pull-request collector image
        id: collector
        run: |
          set -eu
          docker buildx build --network none --pull=false --build-context frozen=.scratch/container-context --platform linux/arm64 --file deploy/docker/collector.Dockerfile --tag "${IMAGE_PREFIX}-collector:pr-${PREVIEW_NUMBER}-${PREVIEW_COMMIT}" --push --provenance=false --sbom=false --label "org.opencontainers.image.revision=${PREVIEW_COMMIT}" --metadata-file "$RUNNER_TEMP/preview-collector.json" .
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/preview-collector.json")" >> "$GITHUB_OUTPUT"
      - name: Publish pull-request migration image
        id: migrate
        run: |
          set -eu
          docker buildx build --network none --pull=false --build-context frozen=.scratch/container-context --platform linux/arm64 --file deploy/docker/migrate.Dockerfile --tag "${IMAGE_PREFIX}-migrate:pr-${PREVIEW_NUMBER}-${PREVIEW_COMMIT}" --push --provenance=false --sbom=false --label "org.opencontainers.image.revision=${PREVIEW_COMMIT}" --metadata-file "$RUNNER_TEMP/preview-migrate.json" .
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/preview-migrate.json")" >> "$GITHUB_OUTPUT"
      - name: Publish pull-request backup image
        id: backup
        run: |
          set -eu
          docker buildx build --network none --pull=false --build-context frozen=.scratch/container-context --platform linux/arm64 --file deploy/docker/backup.Dockerfile --tag "${IMAGE_PREFIX}-backup:pr-${PREVIEW_NUMBER}-${PREVIEW_COMMIT}" --push --provenance=false --sbom=false --label "org.opencontainers.image.revision=${PREVIEW_COMMIT}" --metadata-file "$RUNNER_TEMP/preview-backup.json" .
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/preview-backup.json")" >> "$GITHUB_OUTPUT"
      - name: Pull preview digests for exact gates
        run: |
          set -eu
          web_ref="${IMAGE_PREFIX}-web@${{ steps.web.outputs.digest }}"
          collector_ref="${IMAGE_PREFIX}-collector@${{ steps.collector.outputs.digest }}"
          migrate_ref="${IMAGE_PREFIX}-migrate@${{ steps.migrate.outputs.digest }}"
          backup_ref="${IMAGE_PREFIX}-backup@${{ steps.backup.outputs.digest }}"
          docker pull --platform linux/arm64 "$POSTGRES_IMAGE"
          docker pull --platform linux/arm64 "$TRIVY_IMAGE"
          docker pull --platform linux/arm64 "$web_ref"
          docker pull --platform linux/arm64 "$collector_ref"
          docker pull --platform linux/arm64 "$migrate_ref"
          docker pull --platform linux/arm64 "$backup_ref"
          cat > "$RUNNER_TEMP/tracegarden-preview-compose.yml" <<EOF
          services:
            web:
              image: $web_ref
            collector:
              image: $collector_ref
            migrate:
              image: $migrate_ref
            backup:
              image: $backup_ref
              user: nonroot
              read_only: true
              tmpfs:
                - /tmp:rw,noexec,nosuid,size=64m
              cap_drop:
                - ALL
              security_opt:
                - no-new-privileges:true
              restart: "no"
          EOF
      - name: Smoke-test exact preview digests
        env:
          COMPOSE_FILE: docker-compose.yml:${{ runner.temp }}/tracegarden-preview-compose.yml
          CONTAINER_SMOKE_NO_BUILD: "1"
          CONTAINER_SMOKE_BACKUP: "1"
          CONTAINER_SMOKE_PROJECT: tracegarden-preview-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm test:container
      - name: Scan exact preview digests before attestation
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tracegarden-preview-cve" "$RUNNER_TEMP/trivy-preview-cache"
          failed=0
          for service_ref in \
            "${IMAGE_PREFIX}-web@${{ steps.web.outputs.digest }}" \
            "${IMAGE_PREFIX}-collector@${{ steps.collector.outputs.digest }}" \
            "${IMAGE_PREFIX}-migrate@${{ steps.migrate.outputs.digest }}" \
            "${IMAGE_PREFIX}-backup@${{ steps.backup.outputs.digest }}"; do
            service="${service_ref##*/}"
            service="${service%%@*}"
            status=0
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/tracegarden-preview-cve:/reports" \
              -v "$RUNNER_TEMP/trivy-preview-cache:/root/.cache" \
              "$TRIVY_IMAGE" image --format json --output "/reports/${service}.json" \
              --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$service_ref" || status=$?
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Generate SBOMs for exact preview digests
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tracegarden-preview-sbom" "$RUNNER_TEMP/trivy-preview-cache"
          for service_ref in \
            "${IMAGE_PREFIX}-web@${{ steps.web.outputs.digest }}" \
            "${IMAGE_PREFIX}-collector@${{ steps.collector.outputs.digest }}" \
            "${IMAGE_PREFIX}-migrate@${{ steps.migrate.outputs.digest }}" \
            "${IMAGE_PREFIX}-backup@${{ steps.backup.outputs.digest }}"; do
            service="${service_ref##*/}"
            service="${service%%@*}"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/tracegarden-preview-sbom:/reports" \
              -v "$RUNNER_TEMP/trivy-preview-cache:/root/.cache" \
              "$TRIVY_IMAGE" image --format spdx-json --output "/reports/${service}.spdx.json" "$service_ref"
            test -s "$RUNNER_TEMP/tracegarden-preview-sbom/${service}.spdx.json"
          done
      - name: Attest preview web SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-web
          subject-digest: ${{ steps.web.outputs.digest }}
          sbom-path: ${{ runner.temp }}/tracegarden-preview-sbom/web.spdx.json
          push-to-registry: true
      - name: Attest preview web provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.3
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      - name: Attest preview collector SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-collector
          subject-digest: ${{ steps.collector.outputs.digest }}
          sbom-path: ${{ runner.temp }}/tracegarden-preview-sbom/collector.spdx.json
          push-to-registry: true
      - name: Attest preview collector provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.3
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-collector
          subject-digest: ${{ steps.collector.outputs.digest }}
          push-to-registry: true
      - name: Attest preview migrate SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-migrate
          subject-digest: ${{ steps.migrate.outputs.digest }}
          sbom-path: ${{ runner.temp }}/tracegarden-preview-sbom/migrate.spdx.json
          push-to-registry: true
      - name: Attest preview migrate provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.3
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-migrate
          subject-digest: ${{ steps.migrate.outputs.digest }}
          push-to-registry: true
      - name: Attest preview backup SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-backup
          subject-digest: ${{ steps.backup.outputs.digest }}
          sbom-path: ${{ runner.temp }}/tracegarden-preview-sbom/backup.spdx.json
          push-to-registry: true
      - name: Attest preview backup provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.3
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-backup
          subject-digest: ${{ steps.backup.outputs.digest }}
          push-to-registry: true
      - name: Write actual preview digests
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tracegarden-preview"
          PREVIEW_NUMBER="$PREVIEW_NUMBER" PREVIEW_COMMIT="$PREVIEW_COMMIT" \
            WEB_REPOSITORY="${IMAGE_PREFIX}-web" WEB_DIGEST="${{ steps.web.outputs.digest }}" \
            COLLECTOR_REPOSITORY="${IMAGE_PREFIX}-collector" COLLECTOR_DIGEST="${{ steps.collector.outputs.digest }}" \
            MIGRATE_REPOSITORY="${IMAGE_PREFIX}-migrate" MIGRATE_DIGEST="${{ steps.migrate.outputs.digest }}" \
            BACKUP_REPOSITORY="${IMAGE_PREFIX}-backup" BACKUP_DIGEST="${{ steps.backup.outputs.digest }}" \
            node scripts/preview-artifact.mjs \
            "$RUNNER_TEMP/tracegarden-preview/preview-image-declaration.yaml" \
            "$RUNNER_TEMP/tracegarden-preview/environments/previews/digests/pr-${PREVIEW_NUMBER}.yaml"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tracegarden-pr-${{ github.event.pull_request.number }}-preview-digests
          path: ${{ runner.temp }}/tracegarden-preview
          if-no-files-found: error
          retention-days: 14

  security:
    name: Dependency, image, secret, and supply-chain checks
    needs: [policy, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          package-manager-cache: false
      - run: npm install --global pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: node scripts/delivery-policy.mjs
      - name: Fail on committed secret patterns
        shell: bash
        run: |
          if git grep -nE '(BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,})' -- ':!pnpm-lock.yaml'; then
            echo 'actionable secret-pattern finding';
            exit 1;
          fi
      - run: git diff --check

  publish:
    name: Publish commit-SHA images with attestations
    if: vars.ENABLE_GHCR_PUBLICATION == 'true' && vars.GHCR_NAMESPACE != '' && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v'))
    needs: [static, postgres, browser, container, manifests, security]
    runs-on: ubuntu-24.04-arm
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      web_digest: ${{ steps.web.outputs.digest }}
      collector_digest: ${{ steps.collector.outputs.digest }}
      migrate_digest: ${{ steps.migrate.outputs.digest }}
      backup_digest: ${{ steps.backup.outputs.digest }}
    env:
      # Set GHCR_NAMESPACE to the lower-case intended private owner before enabling publication.
      GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE }}
      IMAGE_PREFIX: ghcr.io/${{ vars.GHCR_NAMESPACE }}/tracegarden
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          package-manager-cache: false
      - run: npm install --global pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/container-context.mjs
      - run: docker pull --platform linux/arm64 "$BUN_IMAGE"
      - name: Verify publication namespace configuration
        run: test "$GHCR_NAMESPACE" = "${GHCR_NAMESPACE,,}"
      - name: Login to the configured private GHCR namespace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish web image
        id: web
        run: |
          set -eu
          docker buildx build --network none --pull=false --build-context frozen=.scratch/container-context --platform linux/arm64 --file deploy/docker/web.Dockerfile --tag "${IMAGE_PREFIX}-web:${GITHUB_SHA}" --push --provenance=false --sbom=false --label "org.opencontainers.image.revision=${GITHUB_SHA}" --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --metadata-file "$RUNNER_TEMP/web.json" .
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/web.json")" >> "$GITHUB_OUTPUT"
      - name: Publish collector image
        id: collector
        run: |
          set -eu
          docker buildx build --network none --pull=false --build-context frozen=.scratch/container-context --platform linux/arm64 --file deploy/docker/collector.Dockerfile --tag "${IMAGE_PREFIX}-collector:${GITHUB_SHA}" --push --provenance=false --sbom=false --label "org.opencontainers.image.revision=${GITHUB_SHA}" --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --metadata-file "$RUNNER_TEMP/collector.json" .
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/collector.json")" >> "$GITHUB_OUTPUT"
      - name: Publish migration image
        id: migrate
        run: |
          set -eu
          docker buildx build --network none --pull=false --build-context frozen=.scratch/container-context --platform linux/arm64 --file deploy/docker/migrate.Dockerfile --tag "${IMAGE_PREFIX}-migrate:${GITHUB_SHA}" --push --provenance=false --sbom=false --label "org.opencontainers.image.revision=${GITHUB_SHA}" --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --metadata-file "$RUNNER_TEMP/migrate.json" .
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/migrate.json")" >> "$GITHUB_OUTPUT"
      # All release image attestations are attached only after the shared exact-digest
      # smoke and CVE gates.
      - name: Publish backup image
        id: backup
        run: |
          set -eu
          docker buildx build --network none --pull=false --platform linux/arm64 --file deploy/docker/backup.Dockerfile --tag "${IMAGE_PREFIX}-backup:${GITHUB_SHA}" --push --provenance=false --sbom=false --label "org.opencontainers.image.revision=${GITHUB_SHA}" --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --metadata-file "$RUNNER_TEMP/backup.json" .
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/backup.json")" >> "$GITHUB_OUTPUT"
      - name: Pull published digests for exact release smoke
        run: |
          set -eu
          web_ref="${IMAGE_PREFIX}-web@${{ steps.web.outputs.digest }}"
          collector_ref="${IMAGE_PREFIX}-collector@${{ steps.collector.outputs.digest }}"
          migrate_ref="${IMAGE_PREFIX}-migrate@${{ steps.migrate.outputs.digest }}"
          backup_ref="${IMAGE_PREFIX}-backup@${{ steps.backup.outputs.digest }}"
          docker pull --platform linux/arm64 "$POSTGRES_IMAGE"
          docker pull --platform linux/arm64 "$web_ref"
          docker pull --platform linux/arm64 "$collector_ref"
          docker pull --platform linux/arm64 "$migrate_ref"
          docker pull --platform linux/arm64 "$backup_ref"
          cat > "$RUNNER_TEMP/tracegarden-release-compose.yml" <<EOF
          services:
            web:
              image: $web_ref
            collector:
              image: $collector_ref
            migrate:
              image: $migrate_ref
            backup:
              image: $backup_ref
              user: nonroot
              read_only: true
              tmpfs:
                - /tmp:rw,noexec,nosuid,size=64m
              cap_drop:
                - ALL
              security_opt:
                - no-new-privileges:true
              restart: "no"
          EOF
      - name: Smoke-test exact published digests
        env:
          COMPOSE_FILE: docker-compose.yml:${{ runner.temp }}/tracegarden-release-compose.yml
          CONTAINER_SMOKE_NO_BUILD: "1"
          CONTAINER_SMOKE_BACKUP: "1"
          CONTAINER_SMOKE_PROJECT: tracegarden-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm test:container
      - name: Scan exact published digests before attestation
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tracegarden-release-cve" "$RUNNER_TEMP/trivy-release-cache"
          failed=0
          for service_ref in \
            "${IMAGE_PREFIX}-web@${{ steps.web.outputs.digest }}" \
            "${IMAGE_PREFIX}-collector@${{ steps.collector.outputs.digest }}" \
            "${IMAGE_PREFIX}-migrate@${{ steps.migrate.outputs.digest }}" \
            "${IMAGE_PREFIX}-backup@${{ steps.backup.outputs.digest }}"; do
            service="${service_ref##*/}"
            service="${service%%@*}"
            status=0
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/tracegarden-release-cve:/reports" \
              -v "$RUNNER_TEMP/trivy-release-cache:/root/.cache" \
              "$TRIVY_IMAGE" image --format json --output "/reports/${service}.json" \
              --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$service_ref" || status=$?
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Generate SBOMs for exact published digests
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tracegarden-release-sbom" "$RUNNER_TEMP/trivy-release-cache"
          for service_ref in \
            "${IMAGE_PREFIX}-web@${{ steps.web.outputs.digest }}" \
            "${IMAGE_PREFIX}-collector@${{ steps.collector.outputs.digest }}" \
            "${IMAGE_PREFIX}-migrate@${{ steps.migrate.outputs.digest }}" \
            "${IMAGE_PREFIX}-backup@${{ steps.backup.outputs.digest }}"; do
            service="${service_ref##*/}"
            service="${service%%@*}"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/tracegarden-release-sbom:/reports" \
              -v "$RUNNER_TEMP/trivy-release-cache:/root/.cache" \
              "$TRIVY_IMAGE" image --format spdx-json --output "/reports/${service}.spdx.json" "$service_ref"
            test -s "$RUNNER_TEMP/tracegarden-release-sbom/${service}.spdx.json"
          done
      - name: Attest web SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-web
          subject-digest: ${{ steps.web.outputs.digest }}
          sbom-path: ${{ runner.temp }}/tracegarden-release-sbom/web.spdx.json
          push-to-registry: true
      - name: Attest web provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.3
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      - name: Attest collector SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-collector
          subject-digest: ${{ steps.collector.outputs.digest }}
          sbom-path: ${{ runner.temp }}/tracegarden-release-sbom/collector.spdx.json
          push-to-registry: true
      - name: Attest collector provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.3
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-collector
          subject-digest: ${{ steps.collector.outputs.digest }}
          push-to-registry: true
      - name: Attest migrate SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-migrate
          subject-digest: ${{ steps.migrate.outputs.digest }}
          sbom-path: ${{ runner.temp }}/tracegarden-release-sbom/migrate.spdx.json
          push-to-registry: true
      - name: Attest migrate provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.3
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-migrate
          subject-digest: ${{ steps.migrate.outputs.digest }}
          push-to-registry: true
      - name: Attest backup SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-backup
          subject-digest: ${{ steps.backup.outputs.digest }}
          sbom-path: ${{ runner.temp }}/tracegarden-release-sbom/backup.spdx.json
          push-to-registry: true
      - name: Attest backup provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.3
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-backup
          subject-digest: ${{ steps.backup.outputs.digest }}
          push-to-registry: true
      - name: Record immutable image digests
        run: |
          {
            echo "web=${{ steps.web.outputs.digest }}"
            echo "collector=${{ steps.collector.outputs.digest }}"
            echo "migrate=${{ steps.migrate.outputs.digest }}"
            echo "backup=${{ steps.backup.outputs.digest }}"
          } | tee "$RUNNER_TEMP/tracegarden-image-digests.txt"
      - name: Persist digest, SBOM, and provenance evidence
        run: |
          set -eu
          evidence="$RUNNER_TEMP/tracegarden-supply-chain-evidence"
          mkdir -p "$evidence"
          cp "$RUNNER_TEMP/web.json" "$evidence/web-build-metadata.json"
          cp "$RUNNER_TEMP/collector.json" "$evidence/collector-build-metadata.json"
          cp "$RUNNER_TEMP/migrate.json" "$evidence/migrate-build-metadata.json"
          cp "$RUNNER_TEMP/backup.json" "$evidence/backup-build-metadata.json"
          cp "$RUNNER_TEMP/tracegarden-image-digests.txt" "$evidence/image-digests.txt"
          for service in web collector migrate backup; do
            digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/${service}.json")
            test "$digest" != "null" && printf '%s\n' "$digest" > "$evidence/${service}-digest.txt"
            cp "$RUNNER_TEMP/tracegarden-release-sbom/${service}.spdx.json" "$evidence/${service}-sbom.spdx.json"
            docker buildx imagetools inspect --raw "${IMAGE_PREFIX}-${service}@${digest}" > "$evidence/${service}-manifest.json"
          done
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            '{commit: $commit, source: $source, sbom: "actions/attest-sbom with Trivy SPDX JSON", provenance: "actions/attest-build-provenance", evidence: "image manifests, SBOMs, and build metadata"}' \
            > "$evidence/attestation-evidence.json"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tracegarden-${{ github.sha }}-supply-chain-evidence
          path: ${{ runner.temp }}/tracegarden-supply-chain-evidence
          if-no-files-found: error
          retention-days: 90

  promotion-proposal:
    name: Propose protected production GitOps promotion
    if: vars.ENABLE_GITOPS_PROMOTION == 'true' && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v'))
    needs: [publish]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          package-manager-cache: false
      - run: npm install --global pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile
      - name: Validate reviewable promotion proposal
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          WEB_DIGEST: ${{ needs.publish.outputs.web_digest }}
          COLLECTOR_DIGEST: ${{ needs.publish.outputs.collector_digest }}
          MIGRATE_DIGEST: ${{ needs.publish.outputs.migrate_digest }}
          BACKUP_DIGEST: ${{ needs.publish.outputs.backup_digest }}
          GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE }}
        run: |
          set -eu
          test "$RELEASE_COMMIT" = "$(git rev-parse HEAD)"
          for digest in "$WEB_DIGEST" "$COLLECTOR_DIGEST" "$MIGRATE_DIGEST" "$BACKUP_DIGEST"; do
            printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          done
          grep -q 'approvalRequired: true' deploy/promotion/promotion.yaml
          grep -q 'pullRequestRequired: true' deploy/promotion/promotion.yaml
          grep -q 'directClusterMutation: false' deploy/promotion/promotion.yaml
          pnpm build
          pnpm delivery:validate
          mkdir -p "$RUNNER_TEMP/tracegarden-promotion"
          node scripts/promotion-artifact.mjs "$RUNNER_TEMP/tracegarden-promotion/desired-state.patch.yaml"
          {
            printf '%s\n' "releaseCommit=$RELEASE_COMMIT"
            printf '%s\n' "web=$WEB_DIGEST"
            printf '%s\n' "collector=$COLLECTOR_DIGEST"
            printf '%s\n' "migrate=$MIGRATE_DIGEST"
            printf '%s\n' "backup=$BACKUP_DIGEST"
            printf '%s\n' 'desired-state-update=GitOps pull request only'
          } > "$RUNNER_TEMP/tracegarden-promotion/proposal.txt"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tracegarden-${{ github.sha }}-promotion-proposal
          path: ${{ runner.temp }}/tracegarden-promotion
          if-no-files-found: error
          retention-days: 30
